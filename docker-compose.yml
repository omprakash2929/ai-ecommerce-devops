services:
  web:
    image: ${IMAGE:-nexvion:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nexvion
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - nexvion-net

networks:
  nexvion-net:
    driver: bridge
